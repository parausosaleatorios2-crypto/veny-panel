name: AMZP
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AMZP:
    type: application
    platform: iOS
    sources:
      - path: AMZP/Sources
      - path: AMZP/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amzp.motioneditor
        PRODUCT_NAME: AMZP
        INFOPLIST_FILE: AMZP/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "678"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
